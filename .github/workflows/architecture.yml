name: Architecture docs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check source map and generated HTML
        run: python3 scripts/architecture.py --check
      - name: Keep the README concise
        run: test "$(wc -w < README.md)" -le 500
